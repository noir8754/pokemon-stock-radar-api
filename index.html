<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Pokémon 카드 재고 레이더</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#14161a;--muted:#6b7280;--line:#e7e9ee;--good:#0f9f6e;--bad:#c0392b;--accent:#365cf5;--info:#2563eb}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:1140px;margin:auto;padding:24px 16px 56px}.hero{background:linear-gradient(135deg,#111827,#263f84);color:#fff;border-radius:24px;padding:26px}.eyebrow{font-size:12px;letter-spacing:.12em;opacity:.7}.hero h1{margin:7px 0;font-size:32px}.hero p{margin:0;opacity:.82}
.toolbar{display:grid;grid-template-columns:1.15fr .7fr .9fr;gap:12px;margin:16px 0}.panel,.brand-status,.store{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px}input,select,button{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;font-size:14px}button{cursor:pointer;font-weight:700}.primary{background:var(--accent);color:#fff;border:none}.quick{display:flex;gap:8px;margin-top:8px}.quick button{padding:9px;font-size:12px}
.status-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:12px 0 16px}.brand-status strong{display:block;font-size:13px;margin-bottom:4px}.brand-status span{font-size:12px;color:var(--muted)}.ok{border-color:#bfe8d7}.err{border-color:#f2c7c3}.pending{border-color:#cdd8ff}
#map{height:480px;border-radius:20px;border:1px solid var(--line);overflow:hidden}.mapbox{position:relative}.map-status{position:absolute;left:12px;bottom:12px;z-index:500;background:rgba(255,255,255,.96);padding:9px 11px;border-radius:12px;border:1px solid var(--line);font-size:12px}
.section-title{display:flex;justify-content:space-between;align-items:end;margin:24px 0 12px}.section-title h2{margin:0;font-size:20px}.section-title span{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.store h3{margin:0 0 4px;font-size:18px}.meta{font-size:12px;color:var(--muted);line-height:1.5}.item{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 0;border-top:1px solid var(--line);align-items:center}.item:first-of-type{margin-top:12px}.item-name{font-weight:700;font-size:14px}.item-sub{font-size:11px;color:var(--muted);margin-top:3px}.qty{font-size:21px;font-weight:800}.badge{display:inline-flex;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:700;margin-left:6px}.good{background:#e8f8f0;color:#087a54}.info{background:#eaf2ff;color:#1d4ed8}.empty{grid-column:1/-1;background:#fff;border:1px dashed #cbd0db;border-radius:18px;padding:30px;text-align:center;color:var(--muted)}.note{margin-top:22px;font-size:12px;line-height:1.65;color:var(--muted)}
@media(max-width:760px){.toolbar,.grid,.status-grid{grid-template-columns:1fr}.hero h1{font-size:27px}#map{height:420px}.quick{flex-wrap:wrap}.quick button{flex:1 1 30%}}
</style>
</head>
<body><div class="wrap">
<section class="hero"><div class="eyebrow">LIVE TEST v1.0</div><h1>Pokémon 카드 재고 레이더</h1><p>GS25·이마트24·CU·세븐일레븐을 브랜드별 방식에 맞춰 조회합니다.</p></section>
<section class="toolbar">
<div class="panel"><label>지역 검색</label><input id="place" placeholder="예: 강남역, 잠실, 하남 감일동"/><div class="quick"><button data-lat="37.4765" data-lng="126.9638">낙성대</button><button data-lat="37.5086" data-lng="127.1607">감일동</button><button id="me">내 위치</button></div></div>
<div class="panel"><label>편의점</label><select id="brand"><option value="all">전체</option><option value="GS25">GS25</option><option value="emart24">이마트24</option><option value="CU">CU</option><option value="7ELEVEN">세븐일레븐</option></select></div>
<div class="panel"><label>포켓몬카드 조회</label><button class="primary" id="refresh">이 지역 포켓몬카드 재고 조회</button></div>
</section>
<section id="brandStatus" class="status-grid"></section>
<div class="mapbox"><div id="map"></div><div class="map-status" id="mapStatus">지도를 움직인 뒤 조회하세요</div></div>
<div class="section-title"><h2>매장별 포켓몬카드 재고</h2><span id="status">아직 조회 안 함</span></div>
<section id="stores" class="grid"><div class="empty">원하는 지역으로 지도를 옮긴 뒤 조회 버튼을 눌러주세요.</div></section>
<p class="note"><strong>표시 기준:</strong> 포켓몬 TCG 상품만 표시하고 재고 0개는 숨깁니다. 편의점 전산 재고는 실제 판매·입고 시점과 차이가 날 수 있습니다.</p>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
const API='https://mcp.aka.page';
const ALL=['GS25','emart24','CU','7ELEVEN'];
const LABEL={GS25:'GS25',emart24:'이마트24',CU:'CU','7ELEVEN':'세븐일레븐'};
const TERMS=['포켓몬카드','포켓몬확장팩','포켓몬'];
const map=L.map('map').setView([37.5008,127.0257],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);const markers=L.layerGroup().addTo(map);
let grouped=[],diag={};
function qs(o){return new URLSearchParams(Object.entries(o).filter(([,v])=>v!==undefined&&v!==null&&v!==''))}
async function get(path,p={}){const r=await fetch(API+path+'?'+qs(p),{cache:'no-store'});let j=null;try{j=await r.json()}catch{}if(!r.ok)throw new Error('HTTP '+r.status+(j?.error?.message?' · '+j.error.message:''));return j}
function product(brand,p){return{brand,name:p.name||p.itemName||p.shortItemName||p.goodsName||p.productName||'상품',code:p.itemCode||p.pluCd||p.code||p.id||'',price:p.sellPrice??p.viewPrice??p.originPrice??p.price??null}}
function isTCG(name){const s=(name||'').replace(/\s+/g,'').toLowerCase();if(/(교통카드|이즐|티머니|캐시비|ic칩|ic카드|카드케이스|케이스|슬리브|프로텍터|바인더|앨범|파일|홀더|지갑|스티커|키링|피규어|인형|문구|볼펜|초코|쿠키|음료|캔디|젤리|빵|우유|아이스크림|껌|스낵|과자|라면|주스|탄산|커피|사탕|초콜릿|파이)/i.test(s))return false;return /(확장팩|강화확장팩|부스터|스타터덱|스타트덱|구축덱|덱세트|스페셜세트|컬렉션세트|트레이너박스|pokemon.*card|포켓몬.*카드|30th.*(팩|박스|box|celebration)|celebration)/i.test(s)}
function coords(s){return{lat:Number(s.latitude??s.lat),lng:Number(s.longitude??s.lng)}}
function baseStore(s){const c=coords(s);return{code:s.storeCode||s.bizNo||s.code||'',name:s.storeName||s.bizName||s.name||'매장',address:s.address||s.storeAddr||s.addr||'',phone:s.phone||s.tel||'',lat:c.lat,lng:c.lng}}
function stockNum(...vals){for(const v of vals){if(v!==undefined&&v!==null&&v!==''&&Number.isFinite(Number(v)))return Number(v)}return null}
async function searchProducts(brand,term){if(brand==='GS25'){const j=await get('/api/gs25/products',{keyword:term,limit:40});return (j.data?.products||[]).map(x=>product(brand,x))}if(brand==='emart24'){const j=await get('/api/emart24/products',{keyword:term,page:1,pageSize:40});return (j.data?.products||[]).map(x=>product(brand,x))}if(brand==='CU'){const j=await get('/api/cu/inventory',{keyword:term,storeCheck:false,size:40});return (j.data?.inventory?.items||[]).map(x=>product(brand,x))}if(brand==='7ELEVEN'){const j=await get('/api/seveneleven/products',{query:term,page:1,size:40});return (j.data?.products||j.data?.items||[]).map(x=>product(brand,x))}return[]}
async function inventory(brand,p,lat,lng){
  if(brand==='GS25'){
    try{return await get('/api/gs25/inventory',{keyword:p.name,itemCode:p.code||undefined,lat,lng,storeLimit:50,timeoutMs:20000})}
    catch(first){try{return await get('/api/gs25/inventory',{keyword:p.name,lat,lng,storeLimit:50,timeoutMs:20000})}catch(second){throw new Error(second.message||first.message)}}
  }
  if(brand==='emart24')return get('/api/emart24/inventory',{pluCd:p.code||undefined,keyword:p.code?undefined:p.name,lat,lng,storeLimit:30,timeoutMs:20000});
  if(brand==='CU')return get('/api/cu/inventory',{keyword:p.name,lat,lng,size:30,storeLimit:50});
  if(brand==='7ELEVEN')return get('/api/seveneleven/inventory',{keyword:p.name,lat,lng,storeLimit:50,timeoutMs:20000});
}
function parseStores(brand,j){
  if(brand==='GS25')return (j.data?.inventory?.stores||[]).map(s=>({...baseStore(s),stock:stockNum(s.realStockQuantity,s.stockQuantity,s.stock)}));
  if(brand==='CU')return (j.data?.nearbyStores?.stores||j.data?.inventory?.stores||[]).map(s=>({...baseStore(s),stock:stockNum(s.stock,s.stockQuantity,s.bizQty)}));
  if(brand==='7ELEVEN')return (j.data?.inventory?.stores||j.data?.stores||[]).map(s=>({...baseStore(s),stock:stockNum(s.stockQuantity,s.stock,s.qty)}));
  if(brand==='emart24'){
    const near=new Map((j.data?.nearbyStores?.stores||[]).map(s=>[String(s.storeCode||s.bizNo||s.code),s]));
    return (j.data?.stores||[]).map(s=>{const k=String(s.bizNo||s.storeCode||s.code||'');const m={...(near.get(k)||{}),...s};return{...baseStore(m),stock:stockNum(s.bizQty,s.stockQuantity,s.stock,s.qty)}})
  }
  return[]
}
function addRows(rows,brand,p,ss){for(const s of ss)rows.push({brand,product:p,store:s})}
function group(rows){const m=new Map();for(const r of rows){const key=r.brand+'|'+(r.store.code||r.store.name);if(!m.has(key))m.set(key,{brand:r.brand,...r.store,items:[]});const g=m.get(key),ik=r.product.name+'|'+r.product.code;if(!g.items.some(x=>x.key===ik))g.items.push({...r.product,key:ik,stock:r.store.stock})}return [...m.values()]}
function statusBox(brands){document.getElementById('brandStatus').innerHTML=brands.map(b=>{const d=diag[b]||{phase:'pending',text:'대기 중'};return `<div class="brand-status ${d.phase==='ok'?'ok':d.phase==='error'?'err':'pending'}"><strong>${LABEL[b]}</strong><span>${d.text}</span></div>`}).join('')}
function render(){const root=document.getElementById('stores'),bounds=map.getBounds(),sel=document.getElementById('brand').value;const list=grouped.filter(s=>(sel==='all'||s.brand===sel)&&Number.isFinite(s.lat)&&Number.isFinite(s.lng)&&bounds.contains([s.lat,s.lng])).map(s=>({...s,items:s.items.filter(x=>x.stock===null||x.stock>0).sort((a,b)=>(b.stock??-1)-(a.stock??-1))})).filter(s=>s.items.length).sort((a,b)=>Math.max(...b.items.map(x=>x.stock??-1))-Math.max(...a.items.map(x=>x.stock??-1)));markers.clearLayers();if(!list.length){root.innerHTML='<div class="empty">현재 지도 화면에서 재고가 있는 포켓몬카드 상품을 찾지 못했습니다.</div>';return}for(const s of list)L.marker([s.lat,s.lng]).addTo(markers).bindPopup(`<b>${LABEL[s.brand]} ${s.name}</b><br>${s.items.filter(x=>(x.stock??0)>0).length}종 재고 있음<br>${s.address||''}`);root.innerHTML=list.map(s=>`<article class="store"><h3>${LABEL[s.brand]} ${s.name}</h3><div class="meta">${s.address||'주소 정보 없음'}${s.phone?'<br>전화 '+s.phone:''}</div>${s.items.map(x=>`<div class="item"><div><div class="item-name">${x.name}</div><div class="item-sub">${x.code?'코드 '+x.code:''}${x.price!=null?' · '+Number(x.price).toLocaleString()+'원':''}</div></div><div><span class="qty">${x.stock===null?'?':x.stock+'개'}</span><span class="badge ${x.stock===null?'info':'good'}">${x.stock===null?'확인 필요':'재고'}</span></div></div>`).join('')}</article>`).join('')}
async function runBrand(brand,lat,lng,rows){
  diag[brand]={phase:'pending',text:'상품 검색 중'};statusBox(activeBrands());
  let ps=[],searchFail=0,lastSearchError='';
  for(const t of TERMS){try{ps.push(...await searchProducts(brand,t))}catch(e){searchFail++;lastSearchError=e.message||String(e)}}
  const seen=new Set();ps=ps.filter(p=>{const k=p.name+'|'+p.code;if(seen.has(k))return false;seen.add(k);return isTCG(p.name)});
  if(brand==='7ELEVEN'&&ps.length===0){let ok=0,fail=0,last='';for(const term of ['포켓몬카드','포켓몬확장팩']){try{const j=await get('/api/seveneleven/inventory',{keyword:term,lat,lng,storeLimit:50,timeoutMs:20000});const name=j.data?.product?.name||term;const p={brand,name,code:j.data?.product?.code||'',price:j.data?.product?.price??null};addRows(rows,brand,p,parseStores(brand,j));ok++}catch(e){fail++;last=e.message||String(e)}}diag[brand]=ok?{phase:'ok',text:`상품검색 우회 · 재고조회 ${ok}건 성공${fail?' / '+fail+'건 실패':''}`}:{phase:'error',text:`현재 조회 불가 · ${last||lastSearchError||'상위 API 오류'}`};statusBox(activeBrands());return}
  if(!ps.length){diag[brand]={phase:searchFail===TERMS.length?'error':'ok',text:searchFail===TERMS.length?`상품 검색 실패 · ${lastSearchError}`:'TCG 상품 0종'};statusBox(activeBrands());return}
  diag[brand]={phase:'pending',text:`TCG 상품 ${ps.length}종 · 재고 조회 중`};statusBox(activeBrands());
  let ok=0,fail=0,stores=0,lastInvError='';
  for(const p of ps.slice(0,30)){try{const j=await inventory(brand,p,lat,lng);const ss=parseStores(brand,j);addRows(rows,brand,p,ss);ok++;stores+=ss.length}catch(e){fail++;lastInvError=e.message||String(e)}}
  diag[brand]={phase:ok?'ok':'error',text:`상품 ${ps.length}종 · 재고조회 ${ok}건 성공${fail?' / '+fail+'건 실패':''} · 응답매장 ${stores}건${!ok&&lastInvError?' · '+lastInvError:''}`};statusBox(activeBrands())
}
function activeBrands(){const v=document.getElementById('brand').value;return v==='all'?ALL:[v]}
async function refresh(){const btn=document.getElementById('refresh'),brands=activeBrands(),c=map.getCenter(),rows=[];btn.disabled=true;btn.textContent='조회 중...';diag={};for(const b of brands)diag[b]={phase:'pending',text:'대기 중'};statusBox(brands);document.getElementById('status').textContent='조회 중';document.getElementById('stores').innerHTML='<div class="empty">4개 편의점의 상품과 재고를 확인하고 있습니다.</div>';await Promise.allSettled(brands.map(b=>runBrand(b,c.lat,c.lng,rows)));grouped=group(rows);document.getElementById('status').textContent=`${grouped.length}개 매장 결과`;render();btn.disabled=false;btn.textContent='이 지역 포켓몬카드 재고 조회'}
function moveTo(lat,lng,z=15){map.setView([lat,lng],z)}
document.querySelectorAll('.quick button[data-lat]').forEach(b=>b.onclick=()=>moveTo(+b.dataset.lat,+b.dataset.lng));
document.getElementById('me').onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>moveTo(p.coords.latitude,p.coords.longitude),()=>alert('위치 권한을 허용해주세요.')):alert('위치 기능을 사용할 수 없습니다.');
document.getElementById('refresh').onclick=refresh;
document.getElementById('brand').onchange=()=>{statusBox(activeBrands());render()};
map.on('moveend',()=>{const c=map.getCenter();document.getElementById('mapStatus').textContent=`지도 중심 ${c.lat.toFixed(4)}, ${c.lng.toFixed(4)} · 조회 버튼을 누르세요`});
document.getElementById('place').addEventListener('keydown',async e=>{if(e.key!=='Enter')return;const q=e.target.value.trim();if(!q)return;try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=kr&q='+encodeURIComponent(q));const d=await r.json();if(d.length)moveTo(+d[0].lat,+d[0].lon,15);else alert('장소를 찾지 못했습니다.')}catch{alert('장소 검색 실패')}});
statusBox(ALL);
</script></body></html>
